<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>يومي مع ربنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Layout: one centered column. Kids register once, then tick prayer / Gospel / weekly Mass to earn stars, and read the teachers' notes. Teachers get a "المتابعة" tab: table of all kids by day, meeting attendance, stars, and a details + behavior-notes panel per kid. */
  :root {
    --bg: #f4f9ff;
    --surface: #ffffff;
    --ink: #1b2a4a;
    --muted: #5b6b8c;
    --line: #d6e4fb;
    --accent: #2563eb;
    --gold: #f0a30a;
    --gold-ink: #a86a00;
    --done: #17a05d;
    --done-bg: #e6f9ef;
    --done-ink: #0c6b3d;
    --track: #e1ecfd;
    --bad: #d92d20;
    --font-display: "Reem Kufi", "Tajawal", "Segoe UI", Tahoma, sans-serif;
    --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  }
  /* Light by default. Night mode is the page's own switch (body.night), not the device setting. */
  body.night {
    --bg: #0f1830; --surface: #182548; --ink: #eaf0ff; --muted: #a4b3d6; --line: #2f4170;
    --accent: #7fa8ff; --gold: #ffc94d; --gold-ink: #ffc94d; --done: #3ecf8e; --done-bg: #123c2e; --done-ink: #c3f3dc; --track: #263a68; --bad: #ff8f85;
    color-scheme: dark;
  }

  html { color-scheme: light; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    direction: rtl;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 920px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
  .kid { max-width: 680px; width: 100%; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
  #teacher { display: flex; flex-direction: column; gap: 20px; }
  button, input, textarea { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 14px; }
  .cross { flex: none; width: 46px; height: 46px; color: var(--gold); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1.15; margin: 0; text-wrap: balance; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
  .modebtn { margin-inline-start: auto; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }

  .tabs { display: flex; gap: 8px; }
  .tab { flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .notice { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); color: var(--ink); font-size: 0.95rem; }
  .notice.bad { border-color: var(--bad); color: var(--bad); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; margin: 0; }
  .note { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .hello { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
  .link { background: none; border: none; color: var(--accent); font-size: 0.9rem; font-weight: 500; cursor: pointer; text-decoration: underline; padding: 6px 0; min-height: 36px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { min-height: 52px; padding: 0 22px; border-radius: 12px; border: 2px solid var(--accent); background: var(--accent); color: var(--bg); font-weight: 700; font-size: 1.05rem; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }

  .starline { display: flex; align-items: baseline; gap: 8px; }
  .starline .gem { font-size: 1.6rem; }
  .starnum { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .gem { color: var(--gold-ink); }
  .wkstars { margin: 0; color: var(--muted); font-size: 0.9rem; }
  .wkstars b { color: var(--ink); font-family: var(--font-display); font-size: 1.05rem; font-variant-numeric: tabular-nums; }

  /* Registration form */
  .form { display: flex; flex-direction: column; gap: 16px; }
  .grp { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--accent); margin: 6px 0 -4px; padding-top: 12px; border-top: 1px solid var(--line); }
  .grp.first { border-top: none; padding-top: 0; margin-top: 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field label, legend { font-weight: 700; font-size: 0.95rem; }
  .hint { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
  input[type="text"], input[type="tel"], input[type="email"], input[type="password"], textarea {
    width: 100%; min-width: 0; min-height: 52px; padding: 0 14px; border-radius: 12px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-size: 1.05rem;
  }
  input[type="tel"], input[type="email"], input[type="password"] { direction: ltr; text-align: right; }
  textarea { min-height: 104px; padding: 10px 14px; resize: vertical; line-height: 1.6; }
  fieldset { border: none; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .radios { display: flex; gap: 10px; flex-wrap: wrap; }
  .radio { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 18px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 700; cursor: pointer; flex: 1 1 120px; }
  .radio input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
  .radio:has(input:checked) { border-color: var(--accent); background: var(--done-bg); color: var(--done-ink); }
  .sib { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .sib-top { display: flex; justify-content: space-between; align-items: center; }
  .formerr { color: var(--bad); font-weight: 700; margin: 0; }

  .weekbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .range { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; color: var(--accent); }
  .navbtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 0.9rem; font-weight: 500; cursor: pointer; }
  .nav:disabled { opacity: 0.4; cursor: default; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .count { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .msg { color: var(--muted); font-size: 0.95rem; }
  .bar { height: 12px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--done); border-radius: 99px; transition: width 0.4s ease; }
  .bar.full > span { background: var(--gold); }

  .days { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .day { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
  .day.today { border: 2px solid var(--accent); padding: 11px; }
  .day.future { opacity: 0.55; }
  .day-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; flex: 1 1 130px; }
  .day-name { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
  .day-date { color: var(--muted); font-size: 0.9rem; }
  .badge { background: var(--accent); color: var(--bg); font-size: 0.78rem; font-weight: 700; border-radius: 99px; padding: 1px 10px; }
  .badge.full { background: var(--done); color: var(--surface); }
  .ticks { display: flex; gap: 8px; flex-wrap: wrap; flex: 1 1 280px; }

  .tick {
    display: flex; align-items: center; justify-content: flex-start; gap: 10px;
    min-height: 52px; flex: 1 1 130px; padding: 0 14px;
    border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
    font-size: 1rem; font-weight: 700; cursor: pointer; text-align: start;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .tick:disabled { cursor: default; }
  .tick.status { cursor: default; }
  .tick .box { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
  .tick .box svg { width: 16px; height: 16px; }
  .tick[aria-pressed="true"], .tick.on { background: var(--done-bg); border-color: var(--done); color: var(--done-ink); }
  .tick[aria-pressed="true"] .box, .tick.on .box { background: var(--done); border-color: var(--done); color: var(--surface); }
  .tick .gain { margin-inline-start: auto; color: var(--gold-ink); font-size: 1.2rem; line-height: 1; opacity: 0.28; }
  .tick[aria-pressed="true"] .gain, .tick.on .gain { opacity: 1; }
  .tick.pop .box { animation: pop 0.3s ease; }
  @keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .weekly { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
  .weekly h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; color: var(--accent); }

  .tick.big { min-height: 64px; font-size: 1.15rem; flex: none; width: 100%; }
  .tick.big .box { width: 34px; height: 34px; }
  .tick.big .box svg { width: 19px; height: 19px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
  .chip { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; }
  .chip:disabled { opacity: 0.4; cursor: default; }
  .chip[aria-pressed="true"] { background: var(--done-bg); border-color: var(--done); color: var(--done-ink); font-weight: 700; }

  /* Notes (read by kids, written by teachers) */
  .notelist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .notelist li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .nd { color: var(--muted); font-size: 0.8rem; }
  .nt { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; font-weight: 500; }
  .ns { color: var(--bad); font-weight: 700; font-variant-numeric: tabular-nums; }
  .ns.zero { color: var(--muted); font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper .nav { min-width: 44px; min-height: 44px; font-size: 1.2rem; padding: 0; }
  .stepper output { min-width: 28px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; font-variant-numeric: tabular-nums; }

  /* Teacher table */
  .stats { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--muted); font-size: 0.95rem; }
  .stats b { color: var(--ink); font-family: var(--font-display); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; min-width: 960px; font-size: 0.88rem; }
  th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  th { font-weight: 700; color: var(--muted); font-size: 0.82rem; }
  th.today { color: var(--accent); }
  th small { display: block; font-weight: 400; font-variant-numeric: tabular-nums; }
  th.name, td.name { position: sticky; inset-inline-start: 0; z-index: 1; text-align: start; min-width: 130px; border-inline-end: 1px solid var(--line); }
  td.name { white-space: normal; }
  .namebtn { background: none; border: none; padding: 4px 0; min-height: 32px; color: var(--ink); font-size: 0.95rem; font-weight: 700; text-align: start; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 4px; }
  .namebtn[aria-expanded="true"] { color: var(--accent); }
  .joined { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; }
  .m { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-inline: 2px; }
  .m.on { background: var(--done); border-color: var(--done); color: var(--surface); }
  td.future .m { opacity: 0.35; }
  td.total { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill, .pillbtn { display: inline-block; border-radius: 99px; padding: 1px 12px; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--line); color: var(--muted); background: transparent; }
  .pillbtn { min-height: 34px; padding: 0 14px; cursor: pointer; }
  .pill.on, .pillbtn.on { background: var(--done-bg); border-color: var(--done); color: var(--done-ink); }
  .last { display: block; color: var(--muted); font-size: 0.72rem; }
  .mini { background: none; border: none; color: var(--bad); font-size: 0.78rem; font-weight: 500; cursor: pointer; text-decoration: underline; padding: 4px 0; min-height: 32px; }
  .mini.plain { color: var(--muted); }
  .legend { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .empty { text-align: center; padding: 28px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  .empty b { color: var(--ink); font-family: var(--font-display); font-size: 1.2rem; }

  .info { border: 2px solid var(--accent); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .info-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .info h3 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; }
  dl.facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; }
  dl.facts div { min-width: 0; }
  dl.facts .wide { grid-column: 1 / -1; }
  dt { color: var(--muted); font-size: 0.82rem; font-weight: 500; }
  dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; white-space: pre-wrap; }
  dd.ltr { direction: ltr; text-align: right; }
  dd ul { margin: 0; padding-inline-start: 20px; font-weight: 500; white-space: normal; }
  .noteform { display: flex; flex-direction: column; gap: 12px; }

  .verse { text-align: center; color: var(--muted); font-size: 0.95rem; margin: 0; }
  .verse b { color: var(--ink); font-family: var(--font-display); font-weight: 500; font-size: 1.1rem; display: block; }

  @media (prefers-reduced-motion: reduce) {
    .tick.pop .box { animation: none; }
    .bar > span { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header>
    <svg class="cross" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="currentColor" d="M20 4h8v14h14v8H28v14h-8V26H6v-8h14z"/>
      <circle cx="24" cy="22" r="3.2" fill="var(--bg)"/>
    </svg>
    <div>
      <h1>يومي مع ربنا</h1>
      <p class="sub">سنة خامسة ابتدائي · صلاة وإنجيل وقداس، ونجوم كل أسبوع</p>
    </div>
    <button class="modebtn" id="modeBtn" type="button" aria-pressed="false" aria-label="الوضع الليلي" title="الوضع الليلي"></button>
    <button class="link" id="outBtn" type="button" hidden>خروج</button>
  </header>

  <div class="tabs" id="tabs" hidden></div>
  <div id="notes" aria-live="polite"></div>
  <div class="kid" id="kid"></div>
  <div id="teacher" hidden></div>
  <p class="verse" id="verse"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  /* ===== املا البيانات دي من Firebase Console قبل الرفع ===== */
  /* Project settings > General > Your apps > Web app > Config */
  var OWNER_EMAIL = "PUT_YOUR_EMAIL@gmail.com";   // إيميلك إنت
  var firebaseConfig = {
    apiKey: "PUT_API_KEY",
    authDomain: "PUT_PROJECT_ID.firebaseapp.com",
    projectId: "PUT_PROJECT_ID",
    storageBucket: "PUT_PROJECT_ID.firebasestorage.app",
    messagingSenderId: "PUT_SENDER_ID",
    appId: "PUT_APP_ID"
  };
  /* ======================================================== */

  var MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  var VERSES = [
    ["صلّوا بلا انقطاع", "١ تسالونيكي ٥: ١٧"],
    ["سراج لرجلي كلامك ونور لسبيلي", "مزمور ١١٩: ١٠٥"],
    ["اطلبوا أولاً ملكوت الله وبرّه", "متى ٦: ٣٣"]
  ];
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var MAX_TICKS = 15; // 7 days x (prayer + Gospel) + Mass

  function $(id) { return document.getElementById(id); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function dkey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function ar(n) { return n.toLocaleString("ar-EG", { useGrouping: false }); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function digits(s) {
    return String(s == null ? "" : s)
      .replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 1632); })
      .replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 1776); });
  }
  function normPhone(s) { return digits(s).replace(/[\s\-().]/g, ""); }
  function phoneOk(s) { return /^\+?\d{8,15}$/.test(s); }
  function cleanName(v) { return String(v || "").replace(/\s+/g, " ").trim(); }
  function niceDate(k) {
    var p = String(k || "").split("-");
    if (p.length !== 3) return "";
    return ar(Number(p[2])) + " " + MONTHS[Number(p[1]) - 1];
  }

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var todayKey = dkey(today);
  var curMonthKey = today.getFullYear() + "-" + pad(today.getMonth() + 1);

  var S = {
    status: "loading",   // loading | setup | out | ok
    db: null, uid: null, user: null, canEdit: false, isOwner: false, canWrite: null, writeFail: false,
    login: { mode: "in", email: "", pass: "", err: "", busy: false }, teachers: [], tErr: "", unsub: [],
    meLoaded: false, me: null, aw: null,
    recs: [], recsLoaded: false, awards: {}, awardsLoaded: false, awExists: {},
    tab: "kid", kidWeek: 0, teachWeek: 0, confirmDel: null, confirmVoid: null, sel: null,
    nd: { text: "", stars: 1 }, noteErr: "",
    draft: null, editProfile: false, formErr: "",
    err: "", net: false, pop: null, chain: Promise.resolve()
  };

  function weekDays(offset) {
    var start = new Date(today);
    start.setDate(today.getDate() - ((today.getDay() + 1) % 7) + offset * 7);
    var out = [];
    for (var i = 0; i < 7; i++) { var d = new Date(start); d.setDate(start.getDate() + i); out.push(d); }
    return out;
  }
  function rangeLabel(ds) {
    var a = ds[0], b = ds[6];
    return ar(a.getDate()) + " " + MONTHS[a.getMonth()] + " – " + ar(b.getDate()) + " " + MONTHS[b.getMonth()];
  }
  function navButtons(who, offset, limit) {
    return '<div class="navbtns">' +

  /* Stars: +1 for each prayer, Gospel reading, weekly Mass and meeting; minus the deductions in teachers' notes. */
  function calcStars(rec, aw, ds) {
    rec = rec || {}; aw = aw || {};
    var all = { p: 0, b: 0, mass: 0, meet: 0, cut: 0 }, wk = { p: 0, b: 0, mass: 0, meet: 0, cut: 0 };
    var inWeek = {}, wkKey = ds ? dkey(ds[0]) : null;
    if (ds) ds.forEach(function (d) { inWeek[dkey(d)] = true; });
    var days = rec.days || {};
    Object.keys(days).forEach(function (k) {
      var r = days[k] || {};
      if (r.p) { all.p++; if (inWeek[k]) wk.p++; }
      if (r.b) { all.b++; if (inWeek[k]) wk.b++; }
    });
    var masses = rec.masses || {};
    Object.keys(masses).forEach(function (k) { if (masses[k]) { all.mass++; if (k === wkKey) wk.mass++; } });
    var meets = aw.meetings || {};
    Object.keys(meets).forEach(function (k) { if (meets[k]) { all.meet++; if (k === wkKey) wk.meet++; } });
    var notes = aw.notes || {};
    Object.keys(notes).forEach(function (id) {
      var n = notes[id];
      if (!n || n.void) return;
      var c = Number(n.stars) || 0;
      all.cut += c;
      if (inWeek[n.date]) wk.cut += c;
    });
    function sum(o) { return o.p + o.b + o.mass + o.meet - o.cut; }
    return { all: all, week: wk, total: Math.max(0, sum(all)), weekTotal: Math.max(0, sum(wk)) };
  }
  function weekTicks(rec, ds) {
    var days = (rec && rec.days) || {}, t = 0;
    ds.forEach(function (d) { var r = days[dkey(d)]; if (r) { if (r.p) t++; if (r.b) t++; } });
    if (rec && rec.masses && rec.masses[dkey(ds[0])]) t++;
    return t;
  }
  function breakdown(w) {
    var s = "صلاة " + ar(w.p) + " · إنجيل " + ar(w.b) + " · قداس " + ar(w.mass) + " · اجتماع " + ar(w.meet);
    if (w.cut) s += " · خصم −" + ar(w.cut);
    return s;
  }

  function validateDraft(d) {
    var name = cleanName(d.name);
    if (name.length < 2) return { error: "اكتب اسمك بالكامل." };
    var phone = normPhone(d.phone), mom = normPhone(d.momPhone), dad = normPhone(d.dadPhone);
    if (phone && !phoneOk(phone)) return { error: "رقم تليفونك مش مظبوط. اكتب أرقام بس." };
    if (mom && !phoneOk(mom)) return { error: "رقم ماما مش مظبوط. اكتب أرقام بس." };
    if (dad && !phoneOk(dad)) return { error: "رقم بابا مش مظبوط. اكتب أرقام بس." };
    if (!mom && !dad) return { error: "اكتب رقم ماما أو رقم بابا على الأقل." };
    var sv = S.me && S.me.profileAt ? S.me : null;
    if (sv && ((sv.phone && !phone) || (sv.momPhone && !mom) || (sv.dadPhone && !dad))) return { error: "ما ينفعش تمسح رقم اتسجّل. عدّله بس." };
    var address = String(d.address || "").replace(/[ \t]+/g, " ").trim();
    if (address.length < 8) return { error: "اكتب العنوان بالتفصيل." };
    var confessor = cleanName(d.confessor);
    if (confessor.length < 2) return { error: "اكتب اسم أب الاعتراف." };
    var school = cleanName(d.school);
    if (school.length < 2) return { error: "اكتب اسم المدرسة." };
    if (d.hasSib !== "yes" && d.hasSib !== "no") return { error: "اختار: عندك إخوات ولا لأ؟" };
    var sibs = [];
    if (d.hasSib === "yes") {
      for (var i = 0; i < d.sibs.length; i++) {
        var s = d.sibs[i], sn = cleanName(s.name), age = Number(digits(s.age).trim()), sg = cleanName(s.grade);
        if (sn.length < 2 || !digits(s.age).trim() || isNaN(age) || age < 0 || age > 60 || sg.length < 2) {
          return { error: "كمّل بيانات الإخوات: الاسم والسن والسنة الدراسية لكل واحد." };
        }
        sibs.push({ name: sn, age: Math.round(age), grade: sg });
      }
    }
    if (sv && sv.hasSiblings && (d.hasSib !== "yes" || sibs.length < (sv.siblings || []).length)) return { error: "ما ينفعش تمسح الإخوات اللي اتسجّلوا. عدّلهم بس." };
    return { data: {
      name: name, phone: phone, momPhone: mom, dadPhone: dad, address: address, confessor: confessor, school: school,
      hasSiblings: d.hasSib === "yes", siblings: sibs, profileAt: new Date().toISOString()
    } };
  }

        }).join("") + '</ul></section>';

      '<p class="note">كل مرة تصلّي أو تقرأ الإنجيل أو تحضر القداس بتاخد نجمة. وبتاخد نجمة لما تحضر الاجتماع.</p></section>' +

  });

  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f.id === "loginForm") {
      e.preventDefault();
      var em = cleanName(S.login.email).toLowerCase(), pw = S.login.pass || "";
      if (!em || pw.length < 6) { S.login.err = "اكتب الإيميل وباسورد 6 حروف على الأقل."; renderAll(); return; }
      S.login.busy = true; S.login.err = ""; renderAll();
      var pr = S.login.mode === "up"
        ? createUserWithEmailAndPassword(auth, em, pw).then(function (c) { return sendEmailVerification(c.user).catch(function () {}); })
        : signInWithEmailAndPassword(auth, em, pw);
      pr.then(function () { S.login.busy = false; S.login.pass = ""; }).catch(loginErr);
    } else if (f.id === "teacherForm") {
      e.preventDefault();
      if (!S.isOwner || !S.db) return;
      var tm = String(($("tEmail") || {}).value || "").trim().toLowerCase();
      if (!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(tm)) { S.tErr = "اكتب إيميل مظبوط."; renderAll(); return; }
      S.tErr = "";
      enqueue(function () { return setDoc(doc(S.db, "teachers", tm), { addedAt: new Date().toISOString() }); });
      renderAll();
    }
  });

  var auth = null, fdb = null;
  var configured = firebaseConfig && String(firebaseConfig.apiKey || "").indexOf("PUT_") !== 0;
  if (configured) {
    try { var fapp = initializeApp(firebaseConfig); auth = getAuth(fapp); fdb = getFirestore(fapp); } catch (e) { configured = false; }
  }
  if (!configured) { S.status = "setup"; renderAll(); }
  else onAuthStateChanged(auth, async function (user) {
    stopAll(); clearTimeout(netTimer);
    S.me = null; S.meLoaded = false; S.aw = null; S.recs = []; S.recsLoaded = false; S.awards = {}; S.awardsLoaded = false;
    S.teachers = []; S.canEdit = false; S.isOwner = false; S.sel = null; S.draft = null; S.editProfile = false; S.tab = "kid"; S.err = "";
    if (!user) { S.user = null; S.uid = null; S.db = null; S.status = "out"; renderAll(); return; }

    S.user = user; S.uid = user.uid; S.db = fdb; S.status = "ok";
    var mail = String(user.email || "").toLowerCase(), verified = !!user.emailVerified;
    S.isOwner = verified && mail === String(OWNER_EMAIL || "").toLowerCase();
    var isTeacher = false;
    if (!S.isOwner && verified && mail) {
      try { isTeacher = (await getDoc(doc(fdb, "teachers", mail))).exists(); } catch (e) {}
    }
    if (auth.currentUser !== user) return;
    S.canEdit = S.isOwner || isTeacher;
    if (S.canEdit) S.tab = "teacher";
    if (!verified && mail === String(OWNER_EMAIL || "").toLowerCase()) S.err = "أكّد الإيميل من الرسالة اللي وصلتلك، أو ادخل بحساب جوجل، عشان تفتح صفحة المتابعة.";

    netTimer = setTimeout(function () { S.net = true; renderAll(); }, 10000);

    listen(myRef(), function (snap) {
      S.meLoaded = true;
      S.me = snap.exists() ? snap.data() : null;
      if (!snap.metadata.fromCache) serverReached();
      renderAll();
    }, function () {
      S.meLoaded = true; S.err = "مش قادر أفتح بياناتك دلوقتي."; clearTimeout(netTimer); renderAll();
    });
    listen(doc(fdb, "awards", S.uid), function (snap) {
      S.aw = snap.exists() ? snap.data() : null;
      renderAll();
    }, function () {});

    if (S.canEdit) {
      listen(collection(fdb, "records"), function (snap) {
        S.recsLoaded = true;
        S.recs = snap.docs.map(function (d) { return { id: d.id, data: d.data() || {} }; });
        if (!snap.metadata.fromCache) serverReached();
        renderAll();
      }, function () {
        S.recsLoaded = true; S.err = "مش قادر أفتح متابعة الأولاد دلوقتي."; clearTimeout(netTimer); renderAll();
      });
      listen(collection(fdb, "awards"), function (snap) {
        var m = {};
        snap.docs.forEach(function (d) { m[d.id] = d.data() || {}; });
        S.awards = m; S.awardsLoaded = true;
        renderAll();
      }, function () {
        S.awardsLoaded = false; S.err = "مش قادر أفتح النجوم والملاحظات دلوقتي."; renderAll();
      });
    }
    if (S.isOwner) {
      listen(collection(fdb, "teachers"), function (snap) {
        S.teachers = snap.docs.map(function (d) { return d.id; }).sort();
        renderAll();
      }, function () {});
    }
    renderAll();
  });
</script>
</body>
</html>
